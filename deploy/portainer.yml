# Patchwork als Portainer-Stack: Anwendung und eigene PostgreSQL.
# Das Image baut GitHub Actions (.github/workflows/image.yml), hier wird nichts gebaut.
#
# In Portainer: Stacks → Add stack → Repository
#   Repository URL:  https://github.com/lucakuehne/patchwork
#   Reference:       refs/heads/main
#   Compose path:    deploy/portainer.yml
#
# Variablen des Stacks (Environment variables):
#   APP_SECRET         mindestens 32 Zeichen, zufällig. Nach dem ersten Start nicht mehr ändern.
#   POSTGRES_PASSWORD  nur Buchstaben und Ziffern, weil es in der Verbindungsadresse steht
#   PUBLIC_URL         Adresse, unter der die Benutzer Patchwork aufrufen, z.B. http://patchwork.firma.local,
#                      mit HTTPS https://patchwork.firma.local
#   PATCHWORK_PORT     Port auf dem Server für HTTP (Standard: 80)
#   PATCHWORK_HTTPS_PORT  Port auf dem Server für HTTPS (Standard: 443)
#   PATCHWORK_TAG      Image-Version (Standard: latest, z.B. sha-1a2b3c4 für einen bestimmten Commit)
#   MAIL_POLLING       Mail-Abruf ein/aus (Standard: true)
#
# HTTPS: Patchwork liefert es selbst aus. Das Zertifikat richtet man unter Verwaltung → HTTPS ein (Anforderung
# erstellen, von der eigenen Zertifizierungsstelle signieren lassen, hochladen). Danach PUBLIC_URL auf https://
# umstellen; dann leitet Patchwork http:// auf https:// um.
#
# Aktualisieren: im Stack «Pull and redeploy» mit «Re-pull image».

services:
  patchwork:
    image: ghcr.io/lucakuehne/patchwork:${PATCHWORK_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${PATCHWORK_PORT:-80}:8080"
      - "${PATCHWORK_HTTPS_PORT:-443}:8443"
    environment:
      DATABASE_URL: postgres://patchwork:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD muss gesetzt sein}@db:5432/patchwork
      APP_SECRET: ${APP_SECRET:?APP_SECRET muss gesetzt sein (mindestens 32 Zeichen)}
      PUBLIC_URL: ${PUBLIC_URL:?PUBLIC_URL muss gesetzt sein}
      MAIL_POLLING: ${MAIL_POLLING:-true}
      TIME_ZONE: ${TIME_ZONE:-Europe/Zurich}
    volumes:
      - patchwork-data:/data
    # Antwortet die Anwendung und erreicht sie die Datenbank? Sonst zeigt Portainer den Container als «unhealthy».
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: patchwork
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD muss gesetzt sein}
      POSTGRES_DB: patchwork
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patchwork -d patchwork"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  patchwork-data:
  db-data:
