# Vorübergehender Test-Stack «patchwork-test» auf dem Docker-Server: eigene Patchwork-Instanz mit leerer
# Datenbank, Testmailserver (GreenMail), OpenLDAP und Samba-AD für Smoke-, LDAP- und AD-Test.
# Nach dem Test den Stack samt Volumes wieder entfernen.
#
# Die Testskripte erwarten Patchwork, GreenMail und die Verzeichnisdienste unter «localhost» mit festen Ports.
# Deshalb teilen sich Patchwork und «runner» das Netz des Dienstes «net», der diese Ports weiterleitet.
# «runner» holt die Testskripte aus dem Repo (Stand TEST_REF) und erzeugt die Test-Zertifikate in /testfiles/tls.
#
# Ablauf, jeweils im genannten Container ausführen:
#   runner:   node test/smoke.mjs http://localhost:8080
#   openldap: ldapadd -x -H ldap://localhost -D cn=admin,dc=test,dc=local -w admin-pw -f /testfiles/ldap-seed.ldif
#   runner:   node test/ldap-smoke.mjs http://localhost:8080 ada@test.local geheim-geheim
#   samba:    Zertifikate aus /testfiles/tls nach /var/lib/samba/private/tls kopieren, Container neu starten,
#             Testkonten und Gruppen anlegen (wie backend/test/ad-setup.sh)
#   runner:   node test/ad-smoke.mjs http://localhost:8080 ada@test.local geheim-geheim /testfiles/tls/ca.pem
#
# Variablen: PATCHWORK_IMAGE (Standard ghcr.io/lucakuehne/patchwork:latest, z.B. ein auf dem Server gebautes
# patchwork:dev), TEST_REF (Git-Stand der Testskripte, Standard main)
#
# Die Test-Instanz ist von aussen nicht erreichbar (Testzugänge stehen im Repo). Speichergrenzen schützen die
# anderen Dienste auf dem Server.

x-image: &image ${PATCHWORK_IMAGE:-ghcr.io/lucakuehne/patchwork:latest}

services:
  net:
    image: *image
    entrypoint: ["node", "-e"]
    command:
      - |
        const net = require('node:net');
        const forwards = [
          [13025, 'greenmail', 3025], [13143, 'greenmail', 3143],
          [10389, 'openldap', 389], [11389, 'samba', 389], [11636, 'samba', 636],
        ];
        for (const [port, host, target] of forwards) {
          net.createServer((client) => {
            const upstream = net.connect(target, host);
            client.pipe(upstream).pipe(client);
            client.on('error', () => upstream.destroy());
            upstream.on('error', () => client.destroy());
          }).listen(port, '127.0.0.1');
        }
        console.log('Weiterleitungen bereit');
    mem_limit: 128m

  testdb:
    image: postgres:17-alpine
    mem_limit: 256m
    environment:
      POSTGRES_USER: patchwork
      POSTGRES_PASSWORD: patchwork
      POSTGRES_DB: patchwork
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patchwork -d patchwork"]
      interval: 5s
      timeout: 5s
      retries: 10

  patchwork:
    image: *image
    network_mode: service:net
    mem_limit: 512m
    environment:
      DATABASE_URL: postgres://patchwork:patchwork@testdb:5432/patchwork
      APP_SECRET: nur-fuer-den-test-stack-0123456789abcdef
      PUBLIC_URL: http://localhost:8080
      MAIL_POLLING: "false"
    # Eigenes Volume wie in der Produktion: Ablage bleibt beim Wechsel des Images erhalten (Update-Tests)
    volumes:
      - patchworkdata:/data
    depends_on:
      net:
        condition: service_started
      testdb:
        condition: service_healthy

  greenmail:
    image: greenmail/standalone:2.1.3
    mem_limit: 384m
    environment:
      GREENMAIL_OPTS: -Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled
      JAVA_OPTS: -Djava.net.preferIPv4Stack=true -Xmx192m

  openldap:
    image: osixia/openldap:1.5.0
    mem_limit: 256m
    # slapd reserviert Speicher pro möglicher Datei; ohne Grenze kann das Gigabytes belegen
    ulimits:
      nofile:
        soft: 1024
        hard: 1024
    environment:
      LDAP_ORGANISATION: Test
      LDAP_DOMAIN: test.local
      LDAP_ADMIN_PASSWORD: admin-pw
    volumes:
      - testfiles:/testfiles:ro

  samba:
    image: smblds/smblds:latest
    mem_limit: 512m
    environment:
      REALM: TEST.PATCHWORK
      DOMAIN: TESTPW
      ADMINPASS: "Adm1n-Passw0rd!"
    volumes:
      - testfiles:/testfiles:ro

  runner:
    image: *image
    user: root
    network_mode: service:net
    mem_limit: 384m
    working_dir: /app
    environment:
      SMOKE_DATABASE_URL: postgres://patchwork:patchwork@testdb:5432/patchwork
      TEST_REF: ${TEST_REF:-main}
    volumes:
      - testfiles:/testfiles
    depends_on:
      net:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mkdir -p /app/test /testfiles/tls
        node --input-type=module <<'EOF'
        const { writeFile, copyFile } = await import('node:fs/promises');
        for (const file of ['smoke.mjs', 'ldap-smoke.mjs', 'ad-smoke.mjs', 'ldap-seed.ldif']) {
          const url = 'https://raw.githubusercontent.com/lucakuehne/patchwork/' + process.env.TEST_REF + '/backend/test/' + file;
          const res = await fetch(url);
          if (!res.ok) throw new Error(url + ' -> ' + res.status);
          await writeFile('/app/test/' + file, await res.text());
        }
        await copyFile('/app/test/ldap-seed.ldif', '/testfiles/ldap-seed.ldif');
        EOF
        apk add --no-cache openssl >/dev/null
        cd /testfiles/tls
        openssl req -x509 -newkey rsa:2048 -nodes -keyout ca.key -out ca.pem -days 30 -subj "/CN=Patchwork Test CA" \
          -addext "basicConstraints=critical,CA:TRUE" -addext "keyUsage=critical,keyCertSign,cRLSign" 2>/dev/null
        openssl req -newkey rsa:2048 -nodes -keyout key.pem -out server.csr -subj "/CN=localhost" 2>/dev/null
        printf 'subjectAltName=DNS:localhost,IP:127.0.0.1\nextendedKeyUsage=serverAuth\nkeyUsage=critical,digitalSignature,keyEncipherment\nbasicConstraints=CA:FALSE\n' >ext.cnf
        openssl x509 -req -in server.csr -CA ca.pem -CAkey ca.key -CAcreateserial -out cert.pem -days 30 -extfile ext.cnf 2>/dev/null
        chmod 644 ca.pem cert.pem key.pem
        echo "Testdateien bereit (Stand $$TEST_REF)"
        exec tail -f /dev/null

volumes:
  testfiles:
  patchworkdata:
