# Patchwork mit Docker Compose
#
# Mit eigener Datenbank im Container:
#   docker compose --profile db up -d
# Mit externer Datenbank (DATABASE_URL in der Umgebung bzw. .env setzen):
#   docker compose up -d
#
# Variablen werden aus der Umgebung oder der Datei .env im selben Verzeichnis gelesen.

services:
  patchwork:
    build: .
    image: patchwork:latest
    restart: unless-stopped
    ports:
      - "${PATCHWORK_PORT:-8080}:8080"
      # HTTPS, sobald unter Verwaltung → HTTPS ein Zertifikat eingerichtet ist
      - "${PATCHWORK_HTTPS_PORT:-8443}:8443"
    environment:
      # Standard: Datenbank-Container aus dem Profil «db»
      DATABASE_URL: ${DATABASE_URL:-postgres://patchwork:${POSTGRES_PASSWORD:-patchwork}@db:5432/patchwork}
      APP_SECRET: ${APP_SECRET:?APP_SECRET muss gesetzt sein (mindestens 32 Zeichen)}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      MAIL_POLLING: ${MAIL_POLLING:-true}
      TIME_ZONE: ${TIME_ZONE:-Europe/Zurich}
    volumes:
      - patchwork-data:/data
    extra_hosts:
      # Zugriff auf eine PostgreSQL auf dem Docker-Host über host.docker.internal (auch unter Linux)
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
        required: false

  db:
    image: postgres:17-alpine
    profiles: ["db"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: patchwork
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-patchwork}
      POSTGRES_DB: patchwork
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patchwork -d patchwork"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  patchwork-data:
  db-data:
